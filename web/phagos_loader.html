<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1.0">
    <meta name="theme-color" content="#08030e">
    <meta name="color-scheme" content="dark">
    <!-- Godot exports this generated PNG beside the runtime. Avoid a noisy /favicon.ico 404
         during browser QA while retaining the standalone static-host layout. -->
    <link rel="icon" type="image/png" href="phagos.icon.png">
    <title>$GODOT_PROJECT_NAME — Arena Preview</title>
    <style>
        :root {
            --ink: #07020d;
            --marrow: #f8c5ba;
            --plasma: #a963c9;
            --signal: #6ee9ff;
            --pulse: #ff5778;
            --muted: rgba(226, 207, 239, 0.68);
        }

        * { box-sizing: border-box; }
        html, body, #canvas {
            width: 100%; height: 100%; margin: 0; padding: 0; border: 0;
        }
        body {
            overflow: hidden;
            background:
                radial-gradient(ellipse at 50% 55%, #210d32 0%, #0f071b 38%, var(--ink) 78%);
            color: #fff;
            touch-action: none;
        }
        #canvas {
            display: block;
            outline: none;
            position: relative;
            z-index: 1;
        }

        #phagos-loader {
            align-items: center;
            background:
                radial-gradient(circle at 50% 48%, rgba(105, 37, 119, 0.22), transparent 33%),
                radial-gradient(circle at 68% 28%, rgba(73, 210, 255, 0.10), transparent 29%),
                linear-gradient(135deg, #09030f 0%, #16061f 48%, #06030a 100%);
            display: flex;
            inset: 0;
            justify-content: center;
            opacity: 1;
            overflow: hidden;
            position: fixed;
            transition: opacity 420ms ease, visibility 420ms ease;
            visibility: visible;
            z-index: 10;
        }
        #phagos-loader.is-ready {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }
        #phagos-loader::before,
        #phagos-loader::after {
            border: 1px solid rgba(126, 229, 255, 0.10);
            border-radius: 50%;
            content: "";
            height: min(76vw, 960px);
            left: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(76vw, 960px);
        }
        #phagos-loader::after {
            border-color: rgba(245, 102, 154, 0.11);
            height: min(58vw, 720px);
            transform: translate(-50%, -50%) rotate(32deg);
            width: min(58vw, 720px);
        }
        .loader-card {
            align-items: center;
            display: flex;
            flex-direction: column;
            gap: 22px;
            isolation: isolate;
            min-width: min(520px, calc(100vw - 48px));
            text-align: center;
        }
        .core-stage {
            align-items: center;
            display: flex;
            height: 172px;
            justify-content: center;
            position: relative;
            width: 172px;
        }
        .immune-core {
            background:
                radial-gradient(circle at 35% 30%, #fff9fe 0 4%, #ffb5cc 12%, #de517e 34%, #7d245e 66%, #240d36 100%);
            border: 1px solid rgba(255, 222, 239, 0.65);
            border-radius: 48% 52% 46% 54% / 50% 44% 56% 50%;
            box-shadow:
                0 0 22px rgba(255, 91, 140, 0.82),
                0 0 68px rgba(181, 73, 199, 0.46),
                inset 9px 8px 18px rgba(255, 237, 248, 0.25),
                inset -14px -16px 30px rgba(30, 4, 38, 0.52);
            height: 72px;
            position: relative;
            transform: rotate(-8deg);
            width: 72px;
            animation: core-breathe 2.6s ease-in-out infinite;
        }
        .immune-core::after {
            background: radial-gradient(circle, rgba(111, 239, 255, 0.95) 0 8%, rgba(90, 190, 255, 0.24) 30%, transparent 68%);
            border-radius: 50%;
            content: "";
            height: 46px;
            left: 14px;
            position: absolute;
            top: 13px;
            width: 46px;
        }
        .orbit {
            border: 1px solid rgba(110, 233, 255, 0.40);
            border-radius: 50%;
            height: 126px;
            position: absolute;
            width: 126px;
            animation: orbit-spin 8s linear infinite;
        }
        .orbit::before,
        .orbit::after {
            background: var(--signal);
            border-radius: 50%;
            box-shadow: 0 0 16px var(--signal);
            content: "";
            height: 8px;
            position: absolute;
            top: 18px;
            width: 8px;
        }
        .orbit::before { left: 14px; }
        .orbit::after { right: 14px; top: auto; bottom: 18px; }
        .orbit.second {
            border-color: rgba(255, 93, 139, 0.28);
            height: 158px;
            transform: rotate(65deg);
            width: 158px;
            animation-direction: reverse;
            animation-duration: 11s;
        }
        .eyebrow {
            color: var(--signal);
            font: 600 11px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            letter-spacing: 0.22em;
            margin: 2px 0 -8px;
            text-transform: uppercase;
        }
        h1 {
            font: 600 clamp(30px, 5vw, 48px)/1.05 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 0.16em;
            margin: 0;
            text-indent: 0.16em;
            text-transform: uppercase;
        }
        .status-line {
            color: var(--muted);
            font: 500 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            letter-spacing: 0.10em;
            margin: 0;
            min-height: 18px;
            text-transform: uppercase;
        }
        .progress-track {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(224, 215, 255, 0.18);
            border-radius: 999px;
            box-shadow: inset 0 1px 6px rgba(0, 0, 0, 0.55);
            height: 8px;
            overflow: hidden;
            position: relative;
            width: min(390px, calc(100vw - 72px));
        }
        .progress-value {
            background: linear-gradient(90deg, #ef527f 0%, #c261df 47%, #61e8ff 100%);
            border-radius: inherit;
            box-shadow: 0 0 18px rgba(96, 232, 255, 0.75);
            height: 100%;
            transform-origin: left;
            transition: transform 180ms ease-out;
            width: 100%;
        }
        .progress-meta {
            color: rgba(240, 230, 250, 0.43);
            display: flex;
            font: 500 10px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            justify-content: space-between;
            letter-spacing: 0.12em;
            margin-top: -12px;
            text-transform: uppercase;
            width: min(390px, calc(100vw - 72px));
        }
        .failure {
            color: #ffd1db;
            max-width: 560px;
            padding: 0 24px;
        }
        @keyframes core-breathe {
            0%, 100% { transform: rotate(-8deg) scale(0.92); filter: saturate(0.88); }
            50% { transform: rotate(8deg) scale(1.10); filter: saturate(1.22) brightness(1.16); }
        }
        @keyframes orbit-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            .immune-core, .orbit { animation: none; }
            #phagos-loader { transition-duration: 300ms; }
        }
    </style>
    $GODOT_HEAD_INCLUDE
</head>
<body>
    <canvas id="canvas">Your browser does not support the canvas element.</canvas>
    <noscript>This browser preview requires JavaScript and WebAssembly.</noscript>

    <main id="phagos-loader" aria-live="polite" aria-label="Loading Phagos arena">
        <section class="loader-card">
            <div class="core-stage" aria-hidden="true">
                <div class="orbit second"></div>
                <div class="orbit"></div>
                <div class="immune-core"></div>
            </div>
            <p class="eyebrow">Immune system simulation</p>
            <h1>Phagos</h1>
            <p id="load-status" class="status-line">Priming the living arena</p>
            <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4">
                <div id="progress-value" class="progress-value" style="transform: scaleX(0.04)"></div>
            </div>
            <div class="progress-meta"><span>WebGL compatibility</span><span id="progress-label">04%</span></div>
        </section>
    </main>

    <script src="$GODOT_URL"></script>
    <script>
        const GODOT_CONFIG = $GODOT_CONFIG;
        const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
        const canvas = document.getElementById('canvas');
        const loader = document.getElementById('phagos-loader');
        const status = document.getElementById('load-status');

        // The Web preset intentionally keeps Godot's automatic canvas policy disabled.
        // Size the backing store ourselves so a CSS-fullscreen canvas is never left at
        // the browser's 300×150 default and remains crisp on high-density displays.
        function resizeCanvas() {
            const density = Math.min(window.devicePixelRatio || 1, 2);
            const width = Math.max(1, Math.round(document.documentElement.clientWidth * density));
            const height = Math.max(1, Math.round(document.documentElement.clientHeight * density));
            if (canvas.width !== width || canvas.height !== height) {
                canvas.width = width;
                canvas.height = height;
            }
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas, { passive: true });
        const progressValue = document.getElementById('progress-value');
        const progressLabel = document.getElementById('progress-label');
        const progressTrack = document.querySelector('.progress-track');
        const engine = new Engine(GODOT_CONFIG);
        let lastProgress = 0.04;

        function updateProgress(current, total) {
            const ratio = total > 0 ? Math.max(0.04, Math.min(1, current / total)) : Math.min(0.18, lastProgress + 0.01);
            lastProgress = Math.max(lastProgress, ratio);
            const percent = Math.round(lastProgress * 100);
            progressValue.style.transform = `scaleX(${lastProgress})`;
            progressLabel.textContent = `${String(percent).padStart(2, '0')}%`;
            progressTrack.setAttribute('aria-valuenow', String(percent));
            status.textContent = percent < 36 ? 'Waking biological shaders' : percent < 76 ? 'Growing the arena network' : 'Stabilizing immune signals';
        }

        function fail(error) {
            console.error('[Phagos Web] bootstrap failed:', error);
            status.classList.add('failure');
            status.textContent = error instanceof Error ? error.message : 'The arena could not start in this browser.';
            progressValue.style.background = 'linear-gradient(90deg, #ff537c, #ffb1bf)';
        }

        const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
        if (missing.length) {
            fail(`Missing browser capability: ${missing.join(', ')}`);
        } else {
            engine.startGame({
                onProgress: updateProgress,
                canvasResizePolicy: 0,
            }).then(() => {
                updateProgress(1, 1);
                window.setTimeout(() => {
                    loader.classList.add('is-ready');
                    window.setTimeout(() => loader.remove(), 460);
                }, 320);
            }).catch(fail);
        }
    </script>
</body>
</html>
