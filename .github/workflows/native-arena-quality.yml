name: Native arena quality

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Native Godot material stack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Set up authoring validation dependencies
        run: python3 -m pip install --upgrade Pillow gdtoolkit

      - name: Validate original baked material maps
        run: python3 tools/validate_cross_section.py

      - name: Check native, engine-export, and web-app launcher syntax
        run: bash -n scripts/preview_native.sh scripts/export_web.sh scripts/preview_web.sh scripts/build_web_app.sh

      - name: Parse Godot project and scripts
        run: |
          godot --headless --path . --editor --quit
          gdlint scripts tools

      - name: Build the live native arena contract
        run: godot --headless --path . --script res://tools/runtime_cross_section_probe.gd

      - name: Export browser/WebView build from the same Godot project
        run: ./scripts/export_web.sh --release

      - name: Verify embedded Godot engine payload
        run: |
          test -s web/public/engine/index.html
          test -s web/public/engine/index.wasm
          test -s web/public/engine/ui_bridge.js
          find web/public/engine -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Set up Node for the application UI
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build HTML/JS application shell
        run: |
          npm --prefix web ci
          npm --prefix web run build
          test -s web/dist/index.html
          test -s web/dist/engine/index.html

      - name: Upload browser/WebView application artifact
        uses: actions/upload-artifact@v4
        with:
          name: phagos-web-application
          path: web/dist/
          if-no-files-found: error
