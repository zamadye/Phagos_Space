name: Native arena quality

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Native Godot material stack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Set up authoring validation dependencies
        run: python3 -m pip install --upgrade Pillow gdtoolkit

      - name: Check portable Godot setup and launchers
        run: |
          bash -n tools/install_godot.sh scripts/preview_native.sh scripts/export_web.sh scripts/preview_web.sh
          python3 tools/validate_godot_setup.py

      - name: Validate original baked material maps
        run: python3 tools/validate_cross_section.py

      - name: Parse Godot project and scripts
        run: |
          godot --headless --path . --editor --quit
          gdlint scripts tools

      - name: Build the live native arena contract
        run: godot --headless --path . --script res://tools/runtime_cross_section_probe.gd

      - name: Export browser/WebView build from the same Godot project
        run: ./scripts/export_web.sh --release

      - name: Verify generated Web payload
        run: |
          test -s build/web/index.html
          test -s build/web/index.wasm
          find build/web -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload browser/WebView artifact
        uses: actions/upload-artifact@v4
        with:
          name: phagos-godot-web
          path: build/web/
          if-no-files-found: error
