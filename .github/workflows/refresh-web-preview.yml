name: Refresh Godot Web preview

on:
  push:
    branches:
      - "arena/01a0d899-phagos-space"
    paths-ignore:
      - "build/web/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-godot-web-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-and-commit:
    name: Export Godot Web build for local WebView
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Godot 4.3 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Export the same native Godot project for WebView
        run: ./scripts/export_web.sh --release

      - name: Commit generated Web preview when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/web
          if git diff --cached --quiet; then
            echo "Generated Web preview is already current."
            exit 0
          fi
          git commit -m "chore: refresh generated Godot Web preview [skip ci]"
          git push origin HEAD:arena/01a0d899-phagos-space
