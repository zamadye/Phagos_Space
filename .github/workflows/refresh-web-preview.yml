name: Refresh embedded Godot engine payload

on:
  push:
    branches:
      - "arena/01a0d899-phagos-space"
    paths-ignore:
      - "web/public/engine/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-embedded-godot-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-and-commit:
    name: Refresh Godot engine embedded by the web app
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Godot 4.3 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Export the Godot engine payload for the HTML/JS application
        run: ./scripts/export_web.sh --release

      - name: Commit refreshed embedded engine payload when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/engine
          if git diff --cached --quiet; then
            echo "Embedded Godot engine payload is already current."
            exit 0
          fi
          git commit -m "chore: refresh embedded Godot engine [skip ci]"
          git push origin HEAD:arena/01a0d899-phagos-space
