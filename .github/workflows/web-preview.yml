name: Web Preview

on:
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: phagos-web-pages
  cancel-in-progress: true

jobs:
  export-and-qa:
    name: Export, visual QA, and browser QA
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Install export and QA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes brotli xvfb
          python3 -m pip install --upgrade Pillow
          npm ci
          npx playwright install --with-deps chrome firefox msedge

      - name: Export Web release
        run: ./scripts/export_web.sh

      - name: Generate arena screenshots
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          # Screenshot capture needs an actual Compatibility/OpenGL surface. `--headless`
          # has no renderer on Ubuntu runners and can wait forever for frame_post_draw.
          timeout 150 xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            godot --path . --rendering-driver opengl3 --script res://tools/capture_screenshots.gd

      - name: Generate asset validation report
        run: python3 tools/validate_assets.py --report reports/asset_validation.json

      - name: Browser validation (Chrome, Firefox, Edge)
        run: |
          python3 -m http.server 8080 --directory build/web >/tmp/phagos-web-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node tools/browser_qa.mjs --url http://127.0.0.1:8080 --report reports/browser_validation.md

      - name: Package static preview
        run: |
          rm -f build/web-preview.zip
          (
            cd build/web
            zip -r ../web-preview.zip .
          )

      - name: Upload web-preview.zip
        uses: actions/upload-artifact@v4
        with:
          name: web-preview.zip
          path: build/web-preview.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload visual and browser reports
        uses: actions/upload-artifact@v4
        with:
          name: phagos-quality-reports
          path: reports/
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    name: Deploy GitHub Pages
    needs: export-and-qa
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
